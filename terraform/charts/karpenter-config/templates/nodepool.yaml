apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        # For predictable placement, single-architecture images should select
        # amd64 or arm64 with nodeSelector. Multi-architecture images need none.
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64", "arm64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: {{ .Values.capacityTypes | toJson }}
        # This POC supplies only "spot", so unavailable Spot capacity will not
        # fall back to On-Demand. Add "on-demand" to capacityTypes to allow it.
        # Kept to the Free Tier-eligible types verified in the test account.
        # For production, allow a broader selection based on workload testing,
        # for example t3/t3a/t4g for burstable workloads and m7i/m7g for
        # general-purpose x86/Graviton workloads, with appropriate larger sizes.
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["t3", "t4g"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["small"]
  limits:
    cpu: "100"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
